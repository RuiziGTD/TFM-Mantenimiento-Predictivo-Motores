version: '3.8'

services:
  # --- 1. FRONTEND ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tfm_frontend
    ports:
      - "4200:80"
    depends_on:
      - api

  # --- 2. API ---
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: tfm_api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    environment:
      - MODEL_PATH=/app/models/lstm_rul.keras

  # --- 3. PROMETHEUS ---
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_container
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - api

  # --- 4. GRAFANA ---
  grafana:
    image: grafana/grafana:latest
    container_name: grafana_container
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # --- 5. TRAINER (Tu salvavidas para el Mac) ---
  trainer:
    build:
      context: .
      # Usamos el Dockerfile de la API porque ya tiene las librerías necesarias
      dockerfile: Dockerfile.api 
    container_name: tfm_trainer
    volumes:
      # Mapeamos TODO para que el código y los datos se guarden en tu Mac
      - ./src:/app/src
      - ./data:/app/data
      - ./output:/app/output
      - ./models:/app/models
      - ./mlruns:/app/mlruns
    # Este perfil oculta el servicio para que no arranque con la web, solo cuando lo llame el Makefile
    profiles: ["training"] 

volumes:
  grafana_data: