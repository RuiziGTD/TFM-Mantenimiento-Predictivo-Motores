<div class="login-container">
  <h2>Login</h2>

  <form (ngSubmit)="onSubmit()" #loginForm="ngForm" novalidate>
    <input
      [(ngModel)]="username"
      name="username"
      placeholder="Usuario"
      required
    >

    <input
      [(ngModel)]="password"
      name="password"
      type="password"
      placeholder="Contraseña"
      required
    >

    <button type="submit">Login</button>
  </form>

  <div class="error" *ngIf="message">
    {{ message }}
  </div>
</div>
