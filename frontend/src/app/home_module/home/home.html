<div class="home-container"> 
  <header class="hero">
    <div class="hero-content">
      <h1>Predicción de fallo de motor</h1>
      <p class="subtitle">Sube un archivo de datos y obtén la predicción de salud del motor</p>
    </div>
  </header>

  <!-- Subida de archivo -->
  <section class="uploader">
    <input id="fileInput" class="file-input" type="file" (change)="onFileSelected($event)" />
    <label for="fileInput" class="file-label">Seleccionar archivo</label>
    <button class="btn primary" (click)="predict()">Predecir</button>
  </section>

  <!-- Dashboard 2x2 -->
  <div class="dashboard-grid" *ngIf="result">
    <!-- Panel 1: Estado de salud -->
    <div class="result-card panel">
      <h2>Estado de Salud de los Motores</h2>
      <canvas #healthChart></canvas>
    </div>

    <!-- Panel 2: Lista filtrada por estado -->
    <div class="result-card panel">
      <h2>Motores {{ selectedStatus || '' }}</h2>
      <ul *ngIf="filteredMotors.length > 0; else emptyMessage">
        <li *ngFor="let motor of filteredMotors">
          ID: {{ motor.unit_id }} | RUL: {{ motor.rul | number:'1.0-0' }}
        </li>
      </ul>
      <ng-template #emptyMessage>
        <p class="muted">Haz clic en una barra del gráfico para filtrar motores</p>
      </ng-template>
    </div>
  </div>
</div>
