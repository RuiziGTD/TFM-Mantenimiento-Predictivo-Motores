<h2>Predicción de fallo de motor</h2>

<input type="file" (change)="onFileSelected($event)" />

<button (click)="predict()">Predecir</button>

<div *ngIf="result">
  <h3>Resultado</h3>
  <pre>{{ result | json }}</pre>
<div class="home-container">
  <header class="hero">
    <div class="hero-content">
      <h1>Predicción de fallo de motor</h1>
      <p class="subtitle">Sube un archivo de datos y obtén la predicción de salud del motor</p>
    </div>
  </header>

  <section class="uploader">
    <input id="fileInput" class="file-input" type="file" (change)="onFileSelected($event)" />
    <label for="fileInput" class="file-label">Seleccionar archivo</label>
    <button class="btn primary" (click)="predict()">Predecir</button>
  </section>
  <section class="result-card">
    <h3>Resultado</h3>
    <div class="result-body">
      <pre class="result-json">{{ result | json }}</pre>
    </div>
  </section>
</div>
